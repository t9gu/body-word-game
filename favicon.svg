<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)"/>
  
  <!-- 游戏手柄图标 -->
  <g fill="white">
    <!-- 手柄主体 -->
    <rect x="25" y="40" width="50" height="25" rx="5" ry="5"/>
    
    <!-- 左侧按钮 -->
    <circle cx="35" cy="52" r="3"/>
    
    <!-- 右侧按钮组 -->
    <circle cx="60" cy="48" r="2.5"/>
    <circle cx="65" cy="52" r="2.5"/>
    <circle cx="60" cy="56" r="2.5"/>
    <circle cx="55" cy="52" r="2.5"/>
    
    <!-- 人形图标（体感） -->
    <circle cx="50" cy="25" r="4"/>
    <line x1="50" y1="29" x2="50" y2="38" stroke="white" stroke-width="2"/>
    <line x1="50" y1="32" x2="44" y2="36" stroke="white" stroke-width="2"/>
    <line x1="50" y1="32" x2="56" y2="36" stroke="white" stroke-width="2"/>
  </g>
  
  <!-- 字母 A (代表学习) -->
  <text x="50" y="82" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">A</text>
</svg>
